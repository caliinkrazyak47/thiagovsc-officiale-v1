<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0D18" />
      <stop offset="50%" stop-color="#09070D" />
      <stop offset="100%" stop-color="#2D0B1C" />
    </linearGradient>
    <linearGradient id="pinkGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5B94" />
      <stop offset="100%" stop-color="#DE4176" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Chassis -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#pinkGlow)" stroke-width="8" opacity="0.8" />
  
  <!-- Glowing Center Neon Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#DE4176" stroke-width="4" stroke-dasharray="16 12" opacity="0.6" />
  
  <!-- Monogram T with Ultra Sharp Impact -->
  <g filter="url(#glow)">
    <path d="M 120 140 L 392 140 L 392 208 L 296 208 L 296 392 L 216 392 L 216 208 L 120 208 Z" fill="url(#pinkGlow)" />
  </g>
  
  <!-- Live Broadcast Dot -->
  <circle cx="392" cy="140" r="20" fill="#00ADEF" />
</svg>
